plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
 id 'org.jetbrains.kotlin.plugin.compose'
}
def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
android {
 namespace 'com.jaeho.myfitlog'
 compileSdk 35
 defaultConfig {
  applicationId 'com.jaeho.myfitlog'
  minSdk 26
  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  targetSdk 35
  versionCode ((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger() + 100)
  versionName ('1.2.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0'))
 }
 signingConfigs {
  release {
   if (signingPath) {
    storeFile file(signingPath)
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('ANDROID_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   signingConfig signingConfigs.release
   minifyEnabled false
  }
 }
 buildFeatures { compose true }
 kotlinOptions { jvmTarget = "17" }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-core'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
 debugImplementation 'androidx.compose.ui:ui-tooling'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
