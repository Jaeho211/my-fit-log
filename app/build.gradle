plugins { id 'com.android.application' }
def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
android {
 namespace 'com.jaeho.myfitlog'
 compileSdk 35
 defaultConfig {
  applicationId 'com.jaeho.myfitlog'
  minSdk 26
  targetSdk 35
  versionCode ((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger() + 100)
  versionName ('1.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0'))
 }
 signingConfigs {
  release {
   if (signingPath) {
    storeFile file(signingPath)
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('ANDROID_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   signingConfig signingConfigs.release
   minifyEnabled false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
